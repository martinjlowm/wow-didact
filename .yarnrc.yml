# The two GitHub deps this project resolves. Yarn 4 refuses git sources unless
# they match here, so a typosquatted URL cannot be fetched silently.
approvedGitRepositories:
  - "**/taskworld/eslint-plugin-progress.git*"
  - "**/wartoshika/wow-classic-declarations.git*"

enableScripts: true

enableTelemetry: false

# node-modules, not PnP: bun resolves the test suite's dependencies (fast-check,
# @types/bun) from a real node_modules tree, and PnP's .pnp.cjs loader is a
# Node-only shim bun does not run.
nodeLinker: node-modules

# Hardlink package files from a global content-addressed store instead of copying
# them per project, so the WoW toolchain is not re-materialised on every install.
nmMode: hardlinks-global
